# Keep Render Backend Alive
#
# Render.com free tier spins down services after 15 minutes of inactivity.
# This cron pings the health endpoint every 12 minutes from GitHub's servers
# so no browser-side keep-alive is needed — zero cost, zero user impact.
#
# Uses HEAD for minimal bandwidth. Retries 3 times on failure.

name: Keep Render warm

on:
  schedule:
    - cron: '*/12 * * * *'  # every 12 minutes
  workflow_dispatch: # allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: curl -sS --retry 3 --retry-delay 5 -o /dev/null -w "%{http_code}" https://reelview-spa.onrender.com/health
